          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Polynomial long division divides a dividend P(x) by a divisor D(x) to find a quotient Q(x) and remainder R(x) satisfying P(x) = D(x)Q(x) + R(x) where degree(R) < degree(D)."
          }
        },
        {
          "@type": "Question",
          "name": "When can synthetic division (Ruffini's Rule) be used?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Synthetic division can be used whenever the divisor polynomial is a linear term of the form (x - c) or (ax + b)."
          }

          "@type": "Question",
          "name": "How do you complete the square for ax^2 + bx + c when a != 1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Factor out 'a' from the x^2 and x terms, then add and subtract ((b/a)/2)^2 inside the bracket, rewriting as a(x + b/2a)^2 + k."
